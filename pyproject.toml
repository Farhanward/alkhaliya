[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alkhaliya"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Local dry-run automation workflow engine."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alkhaliya = "alkhaliya.cli:main"

[tool.setuptools]
packages = ["alkhaliya"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
